<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <title>WireBender</title>
  <rect width="16" height="16" fill="#f3f1e7"/>
  <g fill="#c9c5b4">
    <path id="row" d="M0.35 0.35h.3v.3h-.3zM1.35 0.35h.3v.3h-.3zM2.35 0.35h.3v.3h-.3zM3.35 0.35h.3v.3h-.3zM4.35 0.35h.3v.3h-.3zM5.35 0.35h.3v.3h-.3zM6.35 0.35h.3v.3h-.3zM7.35 0.35h.3v.3h-.3zM8.35 0.35h.3v.3h-.3zM9.35 0.35h.3v.3h-.3zM10.35 0.35h.3v.3h-.3zM11.35 0.35h.3v.3h-.3zM12.35 0.35h.3v.3h-.3zM13.35 0.35h.3v.3h-.3zM14.35 0.35h.3v.3h-.3zM15.35 0.35h.3v.3h-.3z"/>
    <use href="#row" y="1"/><use href="#row" y="2"/><use href="#row" y="3"/><use href="#row" y="4"/>
    <use href="#row" y="5"/><use href="#row" y="6"/><use href="#row" y="7"/><use href="#row" y="8"/>
    <use href="#row" y="9"/><use href="#row" y="10"/><use href="#row" y="11"/><use href="#row" y="12"/>
    <use href="#row" y="13"/><use href="#row" y="14"/><use href="#row" y="15"/>
  </g>
  <!-- the robot, centred on the square board: two hole columns of board on each side -->
  <g transform="translate(2 0)">
    <!-- head -->
    <rect x="1" y="5" width="10" height="10" fill="#9aa0a6"/>
    <rect x="1" y="14" width="10" height="1" fill="#80868c"/>
    <!-- visor band and square eyes -->
    <rect x="2" y="6" width="8" height="4" fill="#3f4650"/>
    <rect x="3" y="7" width="2" height="2" fill="#f3f1e7"/>
    <rect x="7" y="7" width="2" height="2" fill="#f3f1e7"/>
    <!-- grille mouth -->
    <rect x="3" y="11" width="1" height="3" fill="#3f4650"/>
    <rect x="5" y="11" width="1" height="3" fill="#3f4650"/>
    <rect x="7" y="11" width="1" height="3" fill="#3f4650"/>
    <rect x="9" y="11" width="1" height="3" fill="#3f4650"/>
    <!-- bent-wire antenna: two 90 degree bends, ends in a solder blob -->
    <path d="M5.5 5V2.5H9.5V1.8" fill="none" stroke="#b8732f" stroke-width="1"/>
    <circle cx="9.5" cy="1.5" r="1.2" fill="#d9dde0" shape-rendering="auto"/>
  </g>
</svg>
